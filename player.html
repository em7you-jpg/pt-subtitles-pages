<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PT Player</title>

<style>
:root{
  --font: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", "Noto Sans JP", sans-serif;

  --titleSize: 30px;
  --titleGap: 10px;
  --titleOpacity: 0.92;
  --titleTop: 4em;

  --jaSize: 36px;
  --koSize: 30px;
  --lineGap: 14px;

  --bg: rgba(0,0,0,0.0);
  --fg: rgba(255,255,255,0.95);
  --shadow: 0 2px 12px rgba(0,0,0,0.55);
  --pad: 14px;
  --radius: 14px;
  --posX: 50%;
  --posY: 82%;
  --align: center;
  --maxW: 92vw;

  --koColor: #ffd54a;

  --playSize: 54px;
  --playStroke: 1.2px;
  --playIdleOpacity: 0.22;
  --playHoverOpacity: 0.45;
  --playActiveOpacity: 0.65;
  --playLeft: 28px;
  --playTop: 28px;

  /* 🔥 Progress upgraded */
  --progW: min(320px, 55vw);
  --progH: 6px;                 /* 더 두껍게 */
  --progDotSize: 2px;           /* 점 크기 */
  --progDotGap: 18px;           /* 점 간격 */
  --heartSize: 24px;            /* 하트 크게 */
}

body{
  margin:0;
  background:transparent;
  overflow:hidden;
  font-family:var(--font);
}

/* ---------- TITLE ---------- */
#titleWrap{
  position:fixed;
  left:50%;
  top:var(--titleTop);
  transform:translateX(-50%);
  width:min(92vw,980px);
  color:var(--fg);
  text-align:center;
  pointer-events:none;
  filter:drop-shadow(var(--shadow));
}
#title{
  font-size:var(--titleSize);
  font-weight:500;
  opacity:var(--titleOpacity);
  margin:0 0 var(--titleGap) 0;
}

/* ---------- PROGRESS (DOT STYLE FIXED) ---------- */
#progressLine{
  position:relative;
  width:var(--progW);
  height:var(--progH);
  margin:14px auto 0;
  border-radius:999px;

  background-image:
    radial-gradient(circle,
      rgba(255,255,255,0.5) var(--progDotSize),
      transparent var(--progDotSize)
    );
  background-size: var(--progDotGap) var(--progH);
  background-repeat: repeat-x;
  background-position: center;

  pointer-events:auto;
  cursor:pointer;
}

#progressHeart{
  position:absolute;
  top:50%;
  left:0%;
  width:var(--heartSize);
  height:var(--heartSize);
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 12px rgba(255,255,255,0.6));
  transition:left 120ms linear;
}

/* 💗 하트 펄스 */
@keyframes heartPulse{
  0%   { transform:translate(-50%,-50%) scale(1); }
  50%  { transform:translate(-50%,-50%) scale(1.18); }
  100% { transform:translate(-50%,-50%) scale(1); }
}
.playing #progressHeart{
  animation:heartPulse 1.6s ease-in-out infinite;
}

#progressHeart path{
  fill:rgba(255,255,255,0.95);
}

/* ---------- SUBTITLE ---------- */
#wrap{
  position:fixed;
  left:var(--posX);
  top:var(--posY);
  transform:translate(-50%,-50%);
  width:var(--maxW);
  color:var(--fg);
  text-align:var(--align);
}
.ja{ font-size:var(--jaSize); font-weight:500; }
.ko{
  font-size:var(--koSize);
  font-weight:500;
  font-style:italic;
  margin-top:var(--lineGap);
  color:var(--koColor);
}

/* ---------- MINI PLAY ---------- */
#miniPlayDock{
  position:fixed;
  left:var(--playLeft);
  top:var(--playTop);
  z-index:9999;
  pointer-events:none;
}
#btnPlayMini{
  pointer-events:auto;
  width:var(--playSize);
  height:var(--playSize);
  border-radius:50%;
  border:var(--playStroke) solid rgba(255,255,255,var(--playIdleOpacity));
  background:transparent;
  display:grid;
  place-items:center;
  cursor:pointer;
  opacity:var(--playIdleOpacity);
}
#btnPlayMini svg{
  width:calc(var(--playSize)*0.34);
  height:calc(var(--playSize)*0.34);
}
#btnPlayMini path{
  fill:rgba(255,255,255,0.75);
}
</style>
</head>
<body>
