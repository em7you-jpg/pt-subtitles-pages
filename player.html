<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="google" content="notranslate" />
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <link rel="preload" href="/fonts/SeoulNamsanvert.woff2" as="font" type="font/woff2" crossorigin>

  <title>PT Player</title>
  <style>

    @font-face {
      font-family: "SeoulNamsanVert";
      src: url("/fonts/SeoulNamsanvert.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root{
      --font: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", "Noto Sans JP", sans-serif;

      /* ---------- title (TOP) ---------- */
      --titleSize: 34px;
      --titleGap: 10px;
      --titleOpacity: 0.92;
      --titleTop: 4em;

      /* ---------- subtitles ---------- */
      --jaSize: 34px;
      --koSize: 27px;
      --lineGap: 2px;

      --bg: rgba(0,0,0,0.0);
      --fg: rgba(255,255,255,0.95);
      --shadow: 0 2px 12px rgba(0,0,0,0.55);
      --padX: 10px;
      --padY: 16px;
      --radius: 12px;

      /* 우측 세로 자막 위치 */
      --subRight: 4vw;
      --subTop: 51%;
      --align: center;
      --maxH: 78vh;

      /* KO color */
      --koColor: rgba(255, 223, 138, 0.92);

      /* ---------- minimal play button (top-left) ---------- */
      --playSize: 54px;
      --playStroke: 1.2px;
      --playIdleOpacity: 0.22;
      --playHoverOpacity: 0.45;
      --playActiveOpacity: 0.65;
      --playLeft: 28px;
      --playTop: 28px;

      /* ---------- progress (under title) ---------- */
      --progW: min(360px, 60vw);
      --progH: 4px;
      --progLineOpacity: 0.38;
      --heartOpacity: 0.85;
      --heartSize: 22px;
    }

    html, body{
      width:100%;
      height:100%;
      min-height:100vh;
    }

    body{
      margin:0;
      background: #000;
      overflow:visible;
      font-family: var(--font);
      cursor: none;
    }

    /* ---------- TOP TITLE WRAP ---------- */
    #titleWrap{
      position: fixed;
      left: 50%;
      top: var(--titleTop);
      transform: translateX(-50%);
      width: min(92vw, 980px);
      color: var(--fg);
      text-align: center;
      pointer-events: none;
      filter: drop-shadow(var(--shadow));
    }

    #title{
      font-size: var(--titleSize);
      font-weight: 500;
      line-height: 1.2;
      opacity: var(--titleOpacity);
      margin: 0 0 var(--titleGap) 0;
      letter-spacing: 0.2px;
      word-break: keep-all;
    }

    .title-off #titleWrap{ display:none; }

    /* ---------- progress ---------- */
    #progressLine{
      position: relative;
      width: var(--progW);
      height: 6px;
      margin: 16px auto 0;
      border-radius: 999px;

      background-image:
        radial-gradient(circle,
          rgba(255,255,255,0.45) 2px,
          transparent 2px
        );

      background-size: 14px 6px;
      background-repeat: repeat-x;
      background-position: center;

      pointer-events: auto;
      cursor: pointer;
    }

    #progressHeart{
      position: absolute;
      top: 50%;
      left: 0%;
      width: var(--heartSize);
      height: var(--heartSize);
      transform: translate(-50%, -50%);
      opacity: var(--heartOpacity);
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
    }

    #progressHeart path{
      fill: rgba(255,255,255,0.95);
    }

    /* ---------- SUBTITLE WRAP (RIGHT / VERTICAL) ---------- */
    #wrap{      
      position: fixed;
      right: var(--subRight);
      top: calc(var(--titleTop) + 7em);
      transform: none;

      color: var(--fg);
      text-align: start;
      pointer-events: none;
      z-index: 50;
    }

    #box{
      display: flex;
      flex-direction: row-reverse;
      align-items: flex-start;
      gap: 6px;

      background: var(--bg);
      padding: 0 6px 0 0;
      border-radius: var(--radius);
      filter: drop-shadow(var(--shadow));
      pointer-events: auto;
}

    .hud-off #box{ pointer-events:none; }

    .ja{
      display: block;

      font-family: "Yomogi", "Noto Sans JP", sans-serif;
      font-size: var(--jaSize);
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: 0.03em;

      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: pre-wrap;
      text-align: start;
      text-align-last: start;

      max-height: var(--maxH);
      overflow: hidden;

      text-shadow:
        0 0 4px rgba(0,0,0,0.95),
        0 0 10px rgba(0,0,0,0.85),
        0 2px 16px rgba(0,0,0,0.95);
    }

    .ko{
      font-family: "SeoulNamsanVert","Noto Sans KR",system-ui,sans-serif;
      font-size: var(--koSize);
      font-weight: 600;
      font-style: normal;
      line-height: 1.1;
      letter-spacing: -0.02em;

      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: normal;
      word-break: keep-all;
      text-align: start;
      text-align-last: start;

      max-height: var(--maxH);
      overflow: hidden;

      margin-top: 0;

      color: var(--koColor);
      opacity: 1;

      filter: none;
      -webkit-text-stroke: 0.6px rgba(0,0,0,0.35);
      text-shadow:
        0 1px 2px rgba(0,0,0,0.40);
}

    /* ---------- subtitle mask reveal ---------- */
    .sub-mask{
      display: block;
      overflow: hidden;
      will-change: clip-path, opacity, filter;
      backface-visibility: hidden;
    }

    .sub-mask.reveal-in{
      animation: subRevealIn 280ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .sub-mask.reveal-out{
      animation: subRevealOut 220ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes subRevealIn{
      from{
        clip-path: inset(0 0 0 100%);
        opacity: 0;
        filter: blur(4px);
      }
      to{
        clip-path: inset(0 0 0 0);
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes subRevealOut{
      from{
        clip-path: inset(0 0 0 0);
        opacity: 1;
        filter: blur(0);
      }
      to{
        clip-path: inset(0 100% 0 0);
        opacity: 0;
        filter: blur(3px);
      }
    }

    /* ---------- HUD ---------- */
    #hud{ margin-top: 10px; font-size: 13px; opacity: 0.85; user-select: none; }
    .hud-off #hud{ display:none; }
    #hud{ display:none !important; }

    #hudTop, #hudBottom{
      display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap: wrap; margin-top: 6px;
    }
    #hud button, #hud input, #hud audio{ pointer-events: auto; font-size: 13px; }
    #hud button{
      border: 0; border-radius: 10px; padding: 6px 10px;
      background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.95);
      cursor:pointer;
    }
    #hud button:hover{ background: rgba(255,255,255,0.18); }
    #hud .pill{ background: rgba(255,255,255,0.10); padding: 6px 10px; border-radius: 10px; }
    #audio{ width: min(720px, 86vw); }

    /* ---------- MINIMAL PLAY BUTTON ---------- */
    #miniPlayDock{
      position: fixed;
      left: var(--playLeft);
      top: var(--playTop);
      z-index: 9999;
      pointer-events: none;
    }

    #btnPlayMini{
      pointer-events: auto;
      width: var(--playSize);
      height: var(--playSize);
      border-radius: 50%;
      border: var(--playStroke) solid rgba(255,255,255,var(--playIdleOpacity));
      background: rgba(0,0,0,0.0);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: opacity 280ms ease, border-color 280ms ease, transform 160ms ease;
      opacity: var(--playIdleOpacity);
      -webkit-tap-highlight-color: transparent;
    }

    #btnPlayMini:hover{
      opacity: var(--playHoverOpacity);
      border-color: rgba(255,255,255,var(--playHoverOpacity));
    }

    #btnPlayMini:active{
      opacity: var(--playActiveOpacity);
      transform: scale(0.95);
    }

    #btnPlayMini svg{
      width: calc(var(--playSize) * 0.34);
      height: calc(var(--playSize) * 0.34);
    }

    #btnPlayMini path{
      fill: rgba(255,255,255,0.75);
    }

    /* ---------- tiny current time (bottom-right) ---------- */
    #timeSec{
      position: fixed;
      right: 18px;
      bottom: 14px;
      z-index: 9998;
      pointer-events: none;

      font-family: "Noto Sans KR", "Noto Sans JP", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.02em;

      color: rgba(255,255,255,0.42); 
      user-select: none;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div id="miniPlayDock">
    <button id="btnPlayMini" type="button" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 7.5v9l8-4.5-8-4.5z"/>
      </svg>
    </button>
  </div>

  <div id="titleWrap">
    <div id="title"></div>

    <div id="progressLine" role="slider" aria-label="Playback progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <svg id="progressHeart" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s-6.716-4.35-9.33-7.98C.66 10.23 2.06 6.93 5.3 5.97c1.86-.55 3.76.05 4.95 1.36C11.44 6.02 13.34 5.42 15.2 5.97c3.24.96 4.64 4.26 2.63 7.05C18.716 16.65 12 21 12 21z"/>
      </svg>
    </div>
  </div>

  <div id="wrap">
  <div id="box">
    <div id="jaMask" class="sub-mask">
      <div id="ja" class="ja"></div>
    </div>

    <div id="koMask" class="sub-mask" style="display:none;">
      <div id="ko" class="ko"></div>
    </div>

      <div id="hud">
        <div id="hudTop">
          <button id="btnPrev">Prev</button>
          <button id="btnPlay">Play</button>
          <button id="btnNext">Next</button>

          <span class="pill">Track: <span id="trackLabel">-</span></span>
          <span class="pill">Offset: <span id="offsetLabel">0.0</span>s</span>

          <button id="btnOffM">-0.5s</button>
          <button id="btnOffP">+0.5s</button>
        </div>

        <div id="hudBottom">
          <audio id="audio" controls preload="auto" crossorigin="anonymous"></audio>
        </div>
      </div>
    </div>
  </div>

  <div id="timeSec">0</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const setId = params.get("set") || "default";
  const SUBTITLE_GAP = 20;
  const SUB_IN_MS = 280;
  const SUB_OUT_MS = 220;

  (() => {
    if (!/^\d{8}$/.test(setId)) return;

    const bgUrl = `/images/bgi${setId}.jpg`;
    const img = new Image();

    img.onload = () => {
      document.body.style.backgroundImage = `url("${bgUrl}")`;
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center center";
      document.body.style.backgroundRepeat = "no-repeat";
    };

    img.onerror = () => {};

    img.src = bgUrl;
  })();

  const lang = (params.get("lang") || "both").toLowerCase();
  const hud = params.get("hud");
  const cacheBust = params.get("cb") || "";

  const shuffleOn = (params.get("shuffle") ?? "1") !== "0";
  const loopOn = (params.get("loop") ?? "1") !== "0";

  const HOLD_GAP = (() => {
    const v = Number(params.get("holdGap"));
    return Number.isFinite(v) ? v : 1.6;
  })();

  const MIN_CUE_SEC = (() => {
    const v = Number(params.get("minCue"));
    return Number.isFinite(v) ? v : 2.8;
  })();

  const titleOn = (params.get("title") ?? "1") !== "0";
  if (!titleOn) document.body.classList.add("title-off");
  if (hud === "0") document.body.classList.add("hud-off");

  function num(v, d){
    const n = Number(v);
    return Number.isFinite(n) ? n : d;
  }

  const cssVars = {
    "--subRight": params.get("right") ? params.get("right") + "vw" : null,
    "--subTop": params.get("y") ? params.get("y") + "%" : null,
    "--jaSize": params.get("jaSize") ? params.get("jaSize") + "px" : null,
    "--koSize": params.get("koSize") ? params.get("koSize") + "px" : null,
    "--align": params.get("align") || null,
    "--maxH": params.get("maxH") ? params.get("maxH") + "vh" : null,
    "--titleSize": params.get("titleSize") ? params.get("titleSize") + "px" : null,
    "--titleGap": params.get("titleGap") ? params.get("titleGap") + "px" : null,
    "--titleOpacity": params.get("titleOpacity") ? params.get("titleOpacity") : null,
    "--titleTop": params.get("titleTop") ? params.get("titleTop") + "em" : null,
    "--koColor": params.get("koColor") ? params.get("koColor") : null,

    "--progW": params.get("progW") ? params.get("progW") + "px" : null,
    "--progH": params.get("progH") ? params.get("progH") + "px" : null,
    "--progLineOpacity": params.get("progOp") ? params.get("progOp") : null,
    "--heartOpacity": params.get("heartOp") ? params.get("heartOp") : null,
    "--heartSize": params.get("heartSize") ? params.get("heartSize") + "px" : null,
  };

  for (const [k, v] of Object.entries(cssVars)) {
    if (v) document.documentElement.style.setProperty(k, v);
  }

  const titleEl = $("title");
  const jaMask = $("jaMask");
  const koMask = $("koMask");
  const jaEl = $("ja");
  const koEl = $("ko");
  const timeSecEl = $("timeSec");
  const audio = $("audio");

  const btnPrev = $("btnPrev");
  const btnPlay = $("btnPlay");
  const btnNext = $("btnNext");
  const btnOffM = $("btnOffM");
  const btnOffP = $("btnOffP");
  const trackLabel = $("trackLabel");
  const offsetLabel = $("offsetLabel");

  const btnPlayMini = $("btnPlayMini");
  if (btnPlayMini && btnPlay){
    btnPlayMini.addEventListener("click", () => btnPlay.click());
  }

  const progressLine = $("progressLine");
  const progressHeart = $("progressHeart");
  let draggingProgress = false;

  function clamp(n, a, b){
    return Math.max(a, Math.min(b, n));
  }

  function updateProgressUI(){
    if (!progressLine || !progressHeart) return;
    const d = audio.duration;
    if (!Number.isFinite(d) || d <= 0) return;

    const ratio = clamp(audio.currentTime / d, 0, 1);
    const pct = ratio * 100;

    progressHeart.style.left = pct + "%";
    progressLine.setAttribute("aria-valuenow", String(Math.round(pct)));
  }

  function updateTimeSecUI(){
    if (!timeSecEl) return;
    const t = Math.max(0, Math.floor(audio.currentTime || 0));
    timeSecEl.textContent = String(t);
  }

  function seekByClientX(clientX){
    const d = audio.duration;
    if (!Number.isFinite(d) || d <= 0) return;
    if (!progressLine) return;

    const r = progressLine.getBoundingClientRect();
    const x = clamp(clientX - r.left, 0, r.width);
    const ratio = (r.width > 0) ? (x / r.width) : 0;

    audio.currentTime = ratio * d;
    updateProgressUI();
  }

  if (progressLine){
    progressLine.addEventListener("pointerdown", (e) => {
      draggingProgress = true;
      progressLine.setPointerCapture(e.pointerId);
      seekByClientX(e.clientX);
    });

    progressLine.addEventListener("pointermove", (e) => {
      if (!draggingProgress) return;
      seekByClientX(e.clientX);
    });

    progressLine.addEventListener("pointerup", (e) => {
      draggingProgress = false;
      try { progressLine.releasePointerCapture(e.pointerId); } catch (_) {}
    });

    progressLine.addEventListener("keydown", (e) => {
      const d = audio.duration;
      if (!Number.isFinite(d) || d <= 0) return;
      if (e.key === "ArrowLeft") {
        audio.currentTime = Math.max(0, audio.currentTime - 5);
        updateProgressUI();
      }
      if (e.key === "ArrowRight") {
        audio.currentTime = Math.min(d, audio.currentTime + 5);
        updateProgressUI();
      }
    });
  }

  const lsKey = `pt_offset_${setId}`;
  let offsetSec = num(localStorage.getItem(lsKey), 0.0);

  function setOffset(v){
    offsetSec = Math.round(v * 10) / 10;
    localStorage.setItem(lsKey, String(offsetSec));
    offsetLabel.textContent = offsetSec.toFixed(1);
  }

  setOffset(offsetSec);

  function withCB(url){
    const u = new URL(url, location.origin);
    u.searchParams.set("v", cacheBust || Date.now().toString());
    return u.toString();
  }

  async function fetchJSON(url){
    const res = await fetch(withCB(url), { cache: "no-store" });
    if (!res.ok) throw new Error(`fetch failed: ${res.status} ${url}`);
    return await res.json();
  }

  let timedLines = [];

  function lineAtTime(t){
    if (!timedLines.length) return null;
    for (let i = 0; i < timedLines.length; i++){
      const ln = timedLines[i];
      const st = Number(ln.start), ed = Number(ln.end);
      if (!Number.isFinite(st) || !Number.isFinite(ed)) continue;
      if (t >= st && t < ed) return ln;
    }
    return null;
  }

  function extractCues(obj){
    const cues = [];
    const seen = new Set();

    const norm = (s) => (s ?? "").toString().replace(/\r/g, "").trim();
    const firstLine = (s) => {
      s = norm(s);
      if (!s) return "";
      const byNL = s.split("\n").map(x => x.trim()).filter(Boolean);
      return byNL.length ? byNL[0] : s;
    };
    const secondLine = (s) => {
      s = norm(s);
      if (!s) return "";
      const byNL = s.split("\n").map(x => x.trim()).filter(Boolean);
      return (byNL.length >= 2) ? byNL[1] : "";
    };

    function pushCue(s, e, ja, ko, text){
      s = Number(s);
      e = Number(e);
      if (!Number.isFinite(s) || !Number.isFinite(e) || e <= s) return;

      if ((e - s) < MIN_CUE_SEC) e = s + MIN_CUE_SEC;

      const ja1 = firstLine(ja ?? text ?? "");
      if (!ja1) return;

      let ko1 = firstLine(ko ?? "");

      if (!ko1){
        const ko2 = secondLine(text ?? "");
        if (ko2) ko1 = firstLine(ko2);
      }

      const key = `${s.toFixed(3)}|${e.toFixed(3)}|${ja1}`;
      if (seen.has(key)) return;
      seen.add(key);

      cues.push({ start: s, end: e, ja: ja1, ko: ko1 });
    }

    timedLines = Array.isArray(obj?.lines) ? obj.lines.filter(x => x && typeof x === "object") : [];

    if (obj && Array.isArray(obj.cues) && obj.cues.length){
      for (const c of obj.cues){
        if (!c || typeof c !== "object") continue;
        pushCue(
          c.start, c.end,
          c.ja ?? c.text ?? "",
          c.ko ?? "",
          c.text ?? ""
        );
      }
      cues.sort((a, b) => a.start - b.start);
      return cues;
    }

    if (obj && Array.isArray(obj.lines) && obj.lines.length){
      for (const ln of obj.lines){
        if (!ln || typeof ln !== "object") continue;
        pushCue(
          ln.start, ln.end,
          ln.ja ?? ln.text ?? "",
          ln.ko ?? "",
          ln.text ?? ""
        );
      }
      cues.sort((a, b) => a.start - b.start);
      return cues;
    }

    return cues;
  }

  let lastCueIdx = 0;

  function cueAt(cues, t){
    if (!cues || cues.length === 0) return null;

    for (let i = lastCueIdx; i < cues.length; i++){
      const c = cues[i];
      if (t < c.start) break;
      if (t >= c.start && t < (c.end + HOLD_GAP)){
        lastCueIdx = i;
        return c;
      }
    }

    for (let i = Math.min(lastCueIdx, cues.length - 1); i >= 0; i--){
      const c = cues[i];
      if (t >= c.start && t < (c.end + HOLD_GAP)){
        lastCueIdx = i;
        return c;
      }
    }

    return null;
  }

  function compactKoVerticalText(s){
    return (s ?? "")
      .toString()
      .replace(/\r/g, "")
      .replace(/[ ]+/g, "\u2009");
  }

  function stripEmbeddedSongformTagsForSubtitle(s){
    return (s ?? "")
      .toString()
      .replace(/\r/g, "")
      .replace(
        /\s*\|\s*\[(?:Intro(?:\s*-\s*instrumental)?|Verse(?:\s+\d+)?|Pre-Chorus|Chorus|Post-Chorus(?:\s+Reprise)?|Bridge|Final Chorus|Outro)\]\s*/gi,
        " "
      )
      .replace(/\s+/g, " ")
      .trim();
  }

  let jaToken = 0;
  let koToken = 0;

  function playRevealIn(mask){
    mask.classList.remove("reveal-in", "reveal-out");
    void mask.offsetWidth;
    mask.classList.add("reveal-in");
  }

  function playRevealOut(mask){
    mask.classList.remove("reveal-in", "reveal-out");
    void mask.offsetWidth;
    mask.classList.add("reveal-out");
  }
  
  function swapSubtitle(maskEl, textEl, nextText, kind){
    const token = kind === "ja" ? ++jaToken : ++koToken;
    const next = (nextText ?? "").toString();

    if (textEl.textContent === next) return;

    const hasCurrent = !!textEl.textContent.trim();
    const hasNext = !!next.trim();

    if (!hasCurrent){
      textEl.textContent = next;
      if (hasNext){
        maskEl.style.display = "block";
        playRevealIn(maskEl);
      } else {
        maskEl.style.display = "none";
      }
      return;
    }

    playRevealOut(maskEl);

    setTimeout(() => {
      if ((kind === "ja" ? jaToken : koToken) !== token) return;

      textEl.textContent = next;

      if (!hasNext){
        maskEl.style.display = "none";
        return;
      }

      setTimeout(() => {
        if ((kind === "ja" ? jaToken : koToken) !== token) return;
        maskEl.style.display = "block";
        playRevealIn(maskEl);
      }, SUBTITLE_GAP);

    }, SUB_OUT_MS);
  }

  function clearSubtitle(){
    jaToken++;
    koToken++;

    if (jaEl.textContent.trim()){
      playRevealOut(jaMask);
      setTimeout(() => {
        jaEl.textContent = "";
      }, SUB_OUT_MS);
    } else {
      jaEl.textContent = "";
    }

    if (koEl.textContent.trim()){
      playRevealOut(koMask);
      setTimeout(() => {
        koEl.textContent = "";
        koMask.style.display = "none";
      }, SUB_OUT_MS);
    } else {
      koEl.textContent = "";
      koMask.style.display = "none";
    }
  }

  const base = `${location.origin}/set/${encodeURIComponent(setId)}/`;
  const playlistUrl = base + "playlist.json";

  let playlist = null;
  let idx = 0;
  let cues = [];
  let currentTrack = null;

  function updateTrackLabel(){
    if (!currentTrack){
      trackLabel.textContent = "-";
      return;
    }
    trackLabel.textContent = `${currentTrack.id}${currentTrack.title ? " · " + currentTrack.title : ""}`;
  }

  function setHeaderTitle(text){
    const t = (text ?? "").toString().trim();
    titleEl.textContent = t;
    if (t) document.title = `PT Player — ${t}`;
  }

  function shuffleArray(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  async function loadTrack(i){
    if (!playlist) return;
    idx = Math.max(0, Math.min(i, playlist.tracks.length - 1));
    currentTrack = playlist.tracks[idx];
    updateTrackLabel();

    if (!currentTrack.audio_url) throw new Error("missing audio_url");
    audio.src = currentTrack.audio_url;

    if (!currentTrack.track_url) throw new Error("missing track_url");
    const trackJson = await fetchJSON(base + currentTrack.track_url);

    const t = currentTrack.title || trackJson.title || "";
    if (titleOn) setHeaderTitle(t);

    cues = extractCues(trackJson);
    lastCueIdx = 0;
    clearSubtitle();
    updateProgressUI();
    updateTimeSecUI();
  }

  function render(){
    if (!cues || cues.length === 0){
      clearSubtitle();
      return;
    }

    const t = audio.currentTime + offsetSec;
    const c = cueAt(cues, t);
    if (!c){
      clearSubtitle();
      return;
    }

    const jaDisplay = stripEmbeddedSongformTagsForSubtitle(c.ja);
    swapSubtitle(jaMask, jaEl, jaDisplay, "ja");

    let koText = (c.ko ?? "").toString().trim();

    if (!koText){
      const ln = lineAtTime(t);
      if (ln && ln.ko) koText = String(ln.ko).trim();
    }

    const koDisplay = compactKoVerticalText(
      stripEmbeddedSongformTagsForSubtitle(koText)
    );
    const hasKo = !!koDisplay;

    if ((lang === "both" || lang === "ko") && hasKo){
      koMask.style.display = "block";
      swapSubtitle(koMask, koEl, koDisplay, "ko");
    } else {
      swapSubtitle(koMask, koEl, "", "ko");
    }
  }

  btnPlay.addEventListener("click", async () => {
    if (!playlist) return;
    if (audio.paused) await audio.play();
    else audio.pause();
  });

  audio.addEventListener("play", () => btnPlay.textContent = "Pause");
  audio.addEventListener("pause", () => btnPlay.textContent = "Play");

  btnPrev.addEventListener("click", async () => {
    await loadTrack(idx - 1);
    await audio.play();
  });

  btnNext.addEventListener("click", async () => {
    await loadTrack(idx + 1);
    await audio.play();
  });

  btnOffM.addEventListener("click", () => setOffset(offsetSec - 0.5));
  btnOffP.addEventListener("click", () => setOffset(offsetSec + 0.5));

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") btnPrev.click();
    if (e.key === "ArrowRight") btnNext.click();
    if (e.key === "ArrowDown") setOffset(offsetSec - 0.5);
    if (e.key === "ArrowUp") setOffset(offsetSec + 0.5);
    if (e.key === " "){
      e.preventDefault();
      btnPlay.click();
    }
  });

  audio.addEventListener("timeupdate", render);
  audio.addEventListener("seeked", render);

  audio.addEventListener("timeupdate", updateProgressUI);
  audio.addEventListener("loadedmetadata", updateProgressUI);
  audio.addEventListener("seeked", updateProgressUI);

  audio.addEventListener("timeupdate", updateTimeSecUI);
  audio.addEventListener("loadedmetadata", updateTimeSecUI);
  audio.addEventListener("seeked", updateTimeSecUI);
  audio.addEventListener("emptied", updateTimeSecUI);
  audio.addEventListener("ended", updateTimeSecUI);

  audio.addEventListener("ended", async () => {
    if (!playlist) return;

    if (idx < playlist.tracks.length - 1){
      await loadTrack(idx + 1);
      await audio.play();
      return;
    }

    if (loopOn){
      if (shuffleOn) playlist.tracks = shuffleArray(playlist.tracks.slice());
      await loadTrack(0);
      await audio.play();
    } else {
      clearSubtitle();
    }
  });

  (async () => {
    playlist = await fetchJSON(playlistUrl);
    if (!playlist || !Array.isArray(playlist.tracks) || playlist.tracks.length === 0){
      throw new Error("playlist.json invalid or empty");
    }

    if (shuffleOn){
      playlist.tracks = shuffleArray(playlist.tracks.slice());
    }

    const startI = num(params.get("i"), 1);
    await loadTrack(startI - 1);

    if (params.get("autoplay") === "1"){
      const delaySec = Number(params.get("delay") || 7);
      setTimeout(() => {
        audio.play().catch(() => {});
      }, delaySec * 1000);
    }

    updateTrackLabel();
    offsetLabel.textContent = offsetSec.toFixed(1);
    updateProgressUI();
    updateTimeSecUI();
  })().catch(err => {
    jaEl.textContent = "PLAYER ERROR";
    koMask.style.display = "block";
    koEl.textContent = String(err?.message || err);
    console.error(err);
  });


})();
</script>
</body>
</html>
