<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PT Player</title>
  <style>
    :root{
      --font: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", "Noto Sans JP", sans-serif;

      /* ---------- title (TOP) ---------- */
      --titleSize: 30px;
      --titleGap: 10px;
      --titleOpacity: 0.92;
      --titleTop: 4em;

      /* ---------- subtitles ---------- */
      --jaSize: 26px;
      --koSize: 20px;
      --lineGap: 14px;

      --bg: rgba(0,0,0,0.0);
      --fg: rgba(255,255,255,0.95);
      --shadow: 0 2px 12px rgba(0,0,0,0.55);
      --pad: 14px;
      --radius: 14px;
      --posX: 50%;
      --posY: 82%;
      --align: center; /* left|center|right */
      --maxW: 92vw;

      /* KO color */
      --koColor: #ffd54a;

      /* start overlay */
      --startBg: rgba(0,0,0,0.38);
      --startBtnBg: rgba(255,255,255,0.14);
      --startBtnBgHover: rgba(255,255,255,0.20);
    }
    body{
      margin:0; background: transparent; overflow:hidden;
      font-family: var(--font);
    }

    /* ---------- TOP TITLE WRAP ---------- */
    #titleWrap{
      position: fixed;
      left: 50%;
      top: var(--titleTop);
      transform: translateX(-50%);
      width: min(92vw, 980px);
      color: var(--fg);
      text-align: center;
      pointer-events: none;
      filter: drop-shadow(var(--shadow));
    }
    #title{
      font-size: var(--titleSize);
      font-weight: 800;
      line-height: 1.2;
      opacity: var(--titleOpacity);
      margin: 0 0 var(--titleGap) 0;
      letter-spacing: 0.2px;
      word-break: keep-all;
    }
    .title-off #titleWrap{ display:none; }

    /* ---------- SUBTITLE WRAP (BOTTOM) ---------- */
    #wrap{
      position: fixed;
      left: var(--posX);
      top: var(--posY);
      transform: translate(-50%,-50%);
      width: var(--maxW);
      color: var(--fg);
      text-align: var(--align);
      pointer-events: none; /* OBS에서 클릭 안 막기 */
    }
    #box{
      display:inline-block;
      background: var(--bg);
      padding: var(--pad);
      border-radius: var(--radius);
      filter: drop-shadow(var(--shadow));
      pointer-events: auto; /* HUD 켰을 때만 클릭 */
    }
    .hud-off #box{ pointer-events:none; } /* 방송용(hud=0)일 때 클릭 완전 통과 */

    .ja{ font-size: var(--jaSize); font-weight: 700; line-height: 1.25; }
    .ko{
      font-size: var(--koSize);
      font-weight: 700;
      line-height: 1.25;
      margin-top: var(--lineGap);
      color: var(--koColor);
      text-shadow: 0 2px 12px rgba(0,0,0,0.55);
    }

    /* ---------- HUD ---------- */
    #hud{
      margin-top: 10px;
      font-size: 13px;
      opacity: 0.85;
      user-select: none;
    }
    .hud-off #hud{ display:none; }

    #hudTop, #hudBottom{
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    #hud button, #hud input, #hud audio{
      pointer-events: auto;
      font-size: 13px;
    }
    #hud button{
      border: 0;
      border-radius: 10px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.95);
      cursor:pointer;
    }
    #hud button:hover{ background: rgba(255,255,255,0.18); }
    #hud .pill{
      background: rgba(255,255,255,0.10);
      padding: 6px 10px;
      border-radius: 10px;
    }
    #audio{
      width: min(720px, 86vw);
    }

    /* ---------- START OVERLAY (for autoplay blocked) ---------- */
    #startOverlay{
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--startBg);
      pointer-events: auto;
    }
    #startOverlay.on{ display:flex; }
    #startBtn{
      border: 0;
      border-radius: 18px;
      padding: 16px 22px;
      background: var(--startBtnBg);
      color: rgba(255,255,255,0.96);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
      cursor:pointer;
      backdrop-filter: blur(6px);
      filter: drop-shadow(var(--shadow));
    }
    #startBtn:hover{ background: var(--startBtnBgHover); }
    .hud-off #startOverlay{ pointer-events:auto; } /* hud=0이어도 overlay 클릭은 가능 */
  </style>
</head>
<body>

  <!-- Title fixed at TOP -->
  <div id="titleWrap">
    <div id="title"></div>
  </div>

  <!-- Subtitles + HUD -->
  <div id="wrap">
    <div id="box">
      <div id="ja" class="ja"></div>
      <div id="ko" class="ko" style="display:none;"></div>

      <div id="hud">
        <div id="hudTop">
          <button id="btnPrev">Prev</button>
          <button id="btnPlay">Play</button>
          <button id="btnNext">Next</button>

          <span class="pill">Track: <span id="trackLabel">-</span></span>
          <span class="pill">Offset: <span id="offsetLabel">0.0</span>s</span>

          <button id="btnOffM">-0.5s</button>
          <button id="btnOffP">+0.5s</button>
        </div>

        <div id="hudBottom">
          <audio id="audio" controls preload="auto" crossorigin="anonymous"></audio>
        </div>
      </div>
    </div>
  </div>

  <!-- Start overlay -->
  <div id="startOverlay">
    <button id="startBtn">START</button>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  const setId = params.get("set") || "default";
  const lang = (params.get("lang") || "both").toLowerCase(); // both|ja|ko
  const hud = params.get("hud"); // 0 => hide
  const cacheBust = params.get("cb") || ""; // optional external cache buster

  // 기본 랜덤 재생
  const shuffleOn = (params.get("shuffle") ?? "1") !== "0";

  // 마지막까지 가도 계속 반복
  const loopOn = (params.get("loop") ?? "1") !== "0";

  // 자막 hold (끝난 직후에도 유지)
  const HOLD_GAP = (() => {
    const v = Number(params.get("holdGap"));
    return Number.isFinite(v) ? v : 1.20; // ✅ 기본 1.20s
  })();

  // 너무 짧은 cue는 최소 표시시간 보장(화면 표시만)
  const MIN_CUE_SEC = (() => {
    const v = Number(params.get("minCue"));
    return Number.isFinite(v) ? v : 2.20; // ✅ 기본 2.20s
  })();

  // title show/hide
  const titleOn = (params.get("title") ?? "1") !== "0";
  if (!titleOn) document.body.classList.add("title-off");

  if (hud === "0") document.body.classList.add("hud-off");

  // hud 자동 숨김 (재생 시작 후 N초 뒤)
  const hudAutoHideSec = (() => {
    const v = Number(params.get("hudAutoHide"));
    return Number.isFinite(v) ? v : 0;
  })();

  // autoplay 막혔을 때 overlay로 시작 (hud=0에서도 가능)
  const startOverlayOn = (params.get("startOverlay") ?? "0") === "1";

  function num(v, d){ const n = Number(v); return Number.isFinite(n) ? n : d; }

  // style params
  const cssVars = {
    "--posX": params.get("x") ? params.get("x") + "%" : null,
    "--posY": params.get("y") ? params.get("y") + "%" : null,
    "--jaSize": params.get("jaSize") ? params.get("jaSize") + "px" : null,
    "--koSize": params.get("koSize") ? params.get("koSize") + "px" : null,
    "--align": params.get("align") || null,
    "--maxW": params.get("maxW") ? params.get("maxW") + "vw" : null,

    "--titleSize": params.get("titleSize") ? params.get("titleSize") + "px" : null,
    "--titleGap": params.get("titleGap") ? params.get("titleGap") + "px" : null,
    "--titleOpacity": params.get("titleOpacity") ? params.get("titleOpacity") : null,
    "--titleTop": params.get("titleTop") ? params.get("titleTop") + "em" : null,

    "--koColor": params.get("koColor") ? params.get("koColor") : null,
  };
  for (const [k,v] of Object.entries(cssVars)) if (v) document.documentElement.style.setProperty(k, v);

  const titleEl = $("title");
  const jaEl = $("ja");
  const koEl = $("ko");
  const audio = $("audio");

  const btnPrev = $("btnPrev");
  const btnPlay = $("btnPlay");
  const btnNext = $("btnNext");
  const btnOffM = $("btnOffM");
  const btnOffP = $("btnOffP");
  const trackLabel = $("trackLabel");
  const offsetLabel = $("offsetLabel");

  const startOverlay = $("startOverlay");
  const startBtn = $("startBtn");

  // offset per set
  const lsKey = `pt_offset_${setId}`;
  let offsetSec = num(localStorage.getItem(lsKey), 0.0);
  function setOffset(v){
    offsetSec = Math.round(v * 10) / 10;
    localStorage.setItem(lsKey, String(offsetSec));
    offsetLabel.textContent = offsetSec.toFixed(1);
  }
  setOffset(offsetSec);

  function withCB(url){
    const u = new URL(url, location.origin);
    u.searchParams.set("v", cacheBust || Date.now().toString());
    return u.toString();
  }

  async function fetchJSON(url){
    const res = await fetch(withCB(url), {cache:"no-store"});
    if (!res.ok) throw new Error(`fetch failed: ${res.status} ${url}`);
    return await res.json();
  }

  // ---------- cue extraction (KO 복구 핵심) ----------
  // 1) cues가 있으면 cues를 우선 사용
  // 2) BUT cues.ko가 비어있으면 -> lines에서 같은 타임스탬프(오차 허용) ko를 찾아 보강
  // 3) cue.text가 "JA\nKO"면 2번째 줄도 ko 후보로 사용
  function extractCues(obj){
    const cues = [];
    const seen = new Set();

    const norm = (s) => (s ?? "").toString().replace(/\r/g,"").trim();
    const firstLine = (s) => {
      s = norm(s);
      if (!s) return "";
      const byNL = s.split("\n").map(x=>x.trim()).filter(Boolean);
      if (byNL.length) return byNL[0];
      const bySlash = s.split(" / ").map(x=>x.trim()).filter(Boolean);
      if (bySlash.length) return bySlash[0];
      return s;
    };
    const secondLine = (s) => {
      s = norm(s);
      if (!s) return "";
      const byNL = s.split("\n").map(x=>x.trim()).filter(Boolean);
      return (byNL.length >= 2) ? byNL[1] : "";
    };

    // lines 인덱스 (start/end 근접 매칭)
    const timedLines = Array.isArray(obj?.lines) ? obj.lines.filter(x=>x && typeof x==="object") : [];
    function findKoFromLines(st, ed){
      if (!timedLines.length) return "";
      const EPS = 0.25; // 250ms 허용
      let best = null;
      let bestScore = 1e9;
      for (const ln of timedLines){
        const ls = Number(ln.start), le = Number(ln.end);
        if (!Number.isFinite(ls) || !Number.isFinite(le)) continue;
        const ds = Math.abs(ls - st);
        const de = Math.abs(le - ed);
        const score = ds + de;
        if (ds <= EPS && de <= EPS && score < bestScore){
          bestScore = score;
          best = ln;
        }
      }
      const ko = best ? norm(best.ko) : "";
      return ko;
    }

    function pushCue(s,e,ja,ko,text){
      s = Number(s); e = Number(e);
      if (!Number.isFinite(s) || !Number.isFinite(e) || e <= s) return;

      // 표시 최소 시간 보장
      const minEnd = s + MIN_CUE_SEC;
      if (e < minEnd) e = minEnd;

      // 2단락 동시표시 방지: ja/ko는 1줄만
      const ja1 = firstLine(ja ?? text ?? "");
      if (!ja1) return;

      let ko1 = firstLine(ko ?? "");

      // cues.ko 비었으면 text의 2줄(있으면) or lines에서 보강
      if (!ko1){
        const ko2 = secondLine(text ?? "");
        if (ko2) ko1 = firstLine(ko2);
      }
      if (!ko1){
        const lk = findKoFromLines(s, e);
        if (lk) ko1 = firstLine(lk);
      }

      const key = `${s.toFixed(3)}|${e.toFixed(3)}|${ja1}`;
      if (seen.has(key)) return;
      seen.add(key);

      cues.push({start:s, end:e, ja:ja1, ko:ko1});
    }

    // cues 우선
    if (obj && typeof obj === "object" && Array.isArray(obj.cues) && obj.cues.length){
      for (const c of obj.cues){
        if (!c || typeof c !== "object") continue;
        pushCue(
          c.start, c.end,
          c.ja ?? c.text ?? "",
          c.ko ?? "",
          c.text ?? ""
        );
      }
      cues.sort((a,b)=>a.start-b.start);
      return cues;
    }

    // fallback: lines
    if (obj && typeof obj === "object" && Array.isArray(obj.lines) && obj.lines.length){
      for (const ln of obj.lines){
        if (!ln || typeof ln !== "object") continue;
        pushCue(
          ln.start, ln.end,
          ln.ja ?? ln.text ?? "",
          ln.ko ?? "",
          ln.text ?? ""
        );
      }
      cues.sort((a,b)=>a.start-b.start);
      return cues;
    }

    return cues;
  }

  // ---------- cue pick ----------
  let lastCueIdx = 0;
  function cueAt(cues, t){
    if (!cues || cues.length === 0) return null;

    // forward
    for (let i = lastCueIdx; i < cues.length; i++){
      const c = cues[i];
      if (t < c.start) break;
      if (t >= c.start && t < (c.end + HOLD_GAP)){
        lastCueIdx = i;
        return c;
      }
    }
    // backward (seek)
    for (let i = Math.min(lastCueIdx, cues.length - 1); i >= 0; i--){
      const c = cues[i];
      if (t >= c.start && t < (c.end + HOLD_GAP)){
        lastCueIdx = i;
        return c;
      }
    }
    return null;
  }

  function clearSubtitle(){
    if (jaEl.textContent !== "") jaEl.textContent = "";
    if (koEl.textContent !== "") koEl.textContent = "";
    koEl.style.display = "none";
  }

  // ---------- playlist ----------
  const base = `${location.origin}/set/${encodeURIComponent(setId)}/`;
  const playlistUrl = base + "playlist.json";

  let playlist = null;
  let idx = 0;
  let cues = [];
  let currentTrack = null;

  function updateTrackLabel(){
    if (!currentTrack){ trackLabel.textContent = "-"; return; }
    trackLabel.textContent = `${currentTrack.id}${currentTrack.title ? " · " + currentTrack.title : ""}`;
  }

  function setHeaderTitle(text){
    const t = (text ?? "").toString().trim();
    titleEl.textContent = t;
    if (t) document.title = `PT Player — ${t}`;
  }

  function shuffleArray(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function reshuffleIfNeeded(){
    if (!playlist || !Array.isArray(playlist.tracks)) return;
    if (shuffleOn) playlist.tracks = shuffleArray(playlist.tracks.slice());
    idx = 0;
  }

  async function loadTrack(i){
    if (!playlist) return;
    idx = Math.max(0, Math.min(i, playlist.tracks.length-1));
    currentTrack = playlist.tracks[idx];
    updateTrackLabel();

    if (!currentTrack.audio_url) throw new Error("missing audio_url");
    audio.src = currentTrack.audio_url;

    if (!currentTrack.track_url) throw new Error("missing track_url");
    const trackJson = await fetchJSON(base + currentTrack.track_url);

    const t = (currentTrack && currentTrack.title) ? currentTrack.title
            : (trackJson && trackJson.title) ? trackJson.title : "";
    if (titleOn) setHeaderTitle(t);

    cues = extractCues(trackJson);
    lastCueIdx = 0;
    clearSubtitle();
  }

  function render(){
    if (!cues || cues.length === 0){
      clearSubtitle();
      return;
    }

    const t = audio.currentTime + offsetSec;
    const c = cueAt(cues, t);

    if (!c){
      clearSubtitle();
      return;
    }

    // JA always
    if (jaEl.textContent !== c.ja) jaEl.textContent = c.ja;

    // KO
    const hasKo = !!(c.ko && c.ko.trim());
    if ((lang === "both" || lang === "ko") && hasKo){
      if (koEl.textContent !== c.ko) koEl.textContent = c.ko;
      koEl.style.display = "";
    } else {
      koEl.textContent = "";
      koEl.style.display = "none";
    }
  }

  // ---------- controls ----------
  btnPlay.addEventListener("click", async () => {
    if (!playlist) return;
    if (audio.paused) await safePlay();
    else audio.pause();
  });
  audio.addEventListener("play", ()=> btnPlay.textContent = "Pause");
  audio.addEventListener("pause", ()=> btnPlay.textContent = "Play");

  btnPrev.addEventListener("click", async () => {
    await loadTrack(Math.max(0, idx - 1));
    await safePlay();
  });
  btnNext.addEventListener("click", async () => {
    await loadTrack(Math.min(playlist.tracks.length-1, idx + 1));
    await safePlay();
  });

  btnOffM.addEventListener("click", ()=> setOffset(offsetSec - 0.5));
  btnOffP.addEventListener("click", ()=> setOffset(offsetSec + 0.5));

  window.addEventListener("keydown", (e)=>{
    if (e.key === "ArrowLeft") btnPrev.click();
    if (e.key === "ArrowRight") btnNext.click();
    if (e.key === "ArrowDown") setOffset(offsetSec - 0.5);
    if (e.key === "ArrowUp") setOffset(offsetSec + 0.5);
    if (e.key === " "){ e.preventDefault(); btnPlay.click(); }
  });

  audio.addEventListener("timeupdate", render);
  audio.addEventListener("seeked", render);

  audio.addEventListener("ended", async () => {
    if (!playlist) return;

    if (idx < playlist.tracks.length-1){
      await loadTrack(idx + 1);
      await safePlay();
      return;
    }

    // ✅ 끝까지 가면: loopOn이면 다시 셔플하고 계속
    if (loopOn){
      reshuffleIfNeeded();
      await loadTrack(0);
      await safePlay();
    } else {
      clearSubtitle();
    }
  });

  // ---------- autoplay / overlay ----------
  let hudAutoHideTimer = null;

  async function safePlay(){
    try{
      await audio.play();
      // 재생 성공 시 overlay 끄기
      if (startOverlay) startOverlay.classList.remove("on");

      // hud 자동 숨김
      if (hudAutoHideSec > 0){
        clearTimeout(hudAutoHideTimer);
        hudAutoHideTimer = setTimeout(()=>{
          document.body.classList.add("hud-off");
        }, Math.max(0, hudAutoHideSec) * 1000);
      }
      return true;
    }catch(e){
      // autoplay blocked
      if (startOverlayOn){
        startOverlay.classList.add("on");
      }
      throw e;
    }
  }

  startBtn.addEventListener("click", async ()=>{
    try{ await safePlay(); } catch(e){ /* keep overlay */ }
  });

  // ---------- boot ----------
  (async () => {
    playlist = await fetchJSON(playlistUrl);

    if (!playlist || !Array.isArray(playlist.tracks) || playlist.tracks.length === 0){
      throw new Error("playlist.json invalid or empty");
    }

    if (shuffleOn){
      playlist.tracks = shuffleArray(playlist.tracks.slice());
    }

    const startI = num(params.get("i"), 1);
    await loadTrack(startI - 1);

    if (params.get("autoplay") === "1"){
      try{
        await safePlay();
      }catch(e){
        // overlay는 safePlay 내부에서 켜짐 (startOverlay=1일 때)
      }
    }

    updateTrackLabel();
    offsetLabel.textContent = offsetSec.toFixed(1);
  })().catch(err => {
    jaEl.textContent = "PLAYER ERROR";
    koEl.style.display = "";
    koEl.textContent = String(err?.message || err);
    console.error(err);
  });

})();
</script>
</body>
</html>
