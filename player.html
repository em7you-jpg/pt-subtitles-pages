<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PT Player</title>

<style>
:root{
  --font: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", "Noto Sans JP", sans-serif;

  /* Title */
  --titleSize: 30px;
  --titleTop: 4em;
  --titleOpacity: 0.92;

  /* Subtitles */
  --jaSize: 36px;
  --koSize: 30px;
  --lineGap: 14px;
  --koColor: #ffd54a;

  --fg: rgba(255,255,255,0.95);
  --shadow: 0 2px 12px rgba(0,0,0,0.55);

  /* Minimal Play Button */
  --playSize: 54px;
  --playStroke: 1.2px;
  --playBottom: 30px;

  /* 더 은은하게 */
  --playIdleOpacity: 0.22;
  --playHoverOpacity: 0.45;
  --playActiveOpacity: 0.65;
}

body{
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:var(--font);
}

/* ===== TITLE ===== */
#titleWrap{
  position:fixed;
  left:50%;
  top:var(--titleTop);
  text-align:center;
  color:var(--fg);
  pointer-events:none;
  filter:drop-shadow(var(--shadow));
}
#title{
  font-size:var(--titleSize);
  font-weight:500;
  letter-spacing:0.2px;
  opacity:var(--titleOpacity);
}

/* ===== SUBTITLE ===== */
#wrap{
  position:fixed;
  left:50%;
  top:82%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
  color:var(--fg);
  filter:drop-shadow(var(--shadow));
}
.ja{
  font-size:var(--jaSize);
  font-weight:500;
}
.ko{
  font-size:var(--koSize);
  font-weight:500;
  margin-top:var(--lineGap);
  color:var(--koColor);
}

/* ===== MINIMAL PLAY BUTTON ===== */
#playDock{
  position:fixed;
  left:28px;          /* ← 중앙 대신 좌측 고정 */
  top:28px;           /* ← 상단 고정 */
  transform:none;     /* ← 중앙 정렬 제거 */
  z-index:9999;
  pointer-events:none;
}

#btnPlay{
  pointer-events:auto;
  width:var(--playSize);
  height:var(--playSize);
  border-radius:50%;
  border:var(--playStroke) solid rgba(255,255,255,var(--playIdleOpacity));
  background:rgba(0,0,0,0.0);
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:opacity 280ms ease, border-color 280ms ease, transform 160ms ease;
  opacity:var(--playIdleOpacity);
}

#btnPlay:hover{
  opacity:var(--playHoverOpacity);
  border-color:rgba(255,255,255,var(--playHoverOpacity));
}

#btnPlay:active{
  opacity:var(--playActiveOpacity);
  transform:scale(0.95);
}

#btnPlay svg{
  width:calc(var(--playSize)*0.34);
  height:calc(var(--playSize)*0.34);
}
#btnPlay path{
  fill:rgba(255,255,255,0.75);
}

/* 재생 중일 때 기본적으로 숨김 */
.play-hidden #btnPlay{
  opacity:0 !important;
  border-color:rgba(255,255,255,0);
  pointer-events:none;
}

/* 일시정지 시 선명하게 */
.paused #btnPlay{
  opacity:var(--playHoverOpacity);
  border-color:rgba(255,255,255,var(--playHoverOpacity));
}
</style>
</head>

<body>

<div id="titleWrap">
  <div id="title"></div>
</div>

<div id="wrap">
  <div id="ja" class="ja"></div>
  <div id="ko" class="ko"></div>
</div>

<div id="playDock">
  <button id="btnPlay">
    <svg viewBox="0 0 24 24">
      <path d="M9 7.5v9l8-4.5-8-4.5z"/>
    </svg>
  </button>
</div>

<audio id="audio" preload="auto" style="display:none"></audio>

<script>
const audio = document.getElementById("audio");
const btnPlay = document.getElementById("btnPlay");

let hideTimer = null;

function showButtonTemporarily(){
  document.body.classList.remove("play-hidden");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(()=>{
    if(!audio.paused){
      document.body.classList.add("play-hidden");
    }
  }, 2000);
}

btnPlay.addEventListener("click", async ()=>{
  if(audio.paused){
    await audio.play();
  }else{
    audio.pause();
  }
});

audio.addEventListener("play", ()=>{
  document.body.classList.remove("paused");
  showButtonTemporarily();
});

audio.addEventListener("pause", ()=>{
  document.body.classList.remove("play-hidden");
  document.body.classList.add("paused");
});

document.addEventListener("mousemove", ()=>{
  if(!audio.paused){
    showButtonTemporarily();
  }
});
document.addEventListener("click", ()=>{
  if(!audio.paused){
    showButtonTemporarily();
  }
});
</script>

</body>
</html>
