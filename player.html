<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PT Player</title>
  <style>
    :root{
      --font: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", "Noto Sans JP", sans-serif;

      /* ---------- title (TOP) ---------- */
      --titleSize: 30px;
      --titleGap: 10px;
      --titleOpacity: 0.92;
      --titleTop: 4em;

      /* ---------- subtitles ---------- */
      --jaSize: 36px;
      --koSize: 30px;
      --lineGap: 14px;

      --bg: rgba(0,0,0,0.0);
      --fg: rgba(255,255,255,0.95);
      --shadow: 0 2px 12px rgba(0,0,0,0.55);
      --pad: 14px;
      --radius: 14px;
      --posX: 50%;
      --posY: 82%;
      --align: center; /* left|center|right */
      --maxW: 92vw;

      /* KO color */
      --koColor: #ffd54a;
    }
    body{
      margin:0; background: transparent; overflow:hidden;
      font-family: var(--font);
    }

    /* ---------- TOP TITLE WRAP ---------- */
    #titleWrap{
      position: fixed;
      left: 50%;
      top: var(--titleTop);
      transform: translateX(-50%);
      width: min(92vw, 980px);
      color: var(--fg);
      text-align: center;
      pointer-events: none;
      filter: drop-shadow(var(--shadow));
    }
    #title{
      font-size: var(--titleSize);
      font-weight: 800;
      line-height: 1.2;
      opacity: var(--titleOpacity);
      margin: 0 0 var(--titleGap) 0;
      letter-spacing: 0.2px;
      word-break: keep-all;
    }
    .title-off #titleWrap{ display:none; }

    /* ---------- SUBTITLE WRAP (BOTTOM) ---------- */
    #wrap{
      position: fixed;
      left: var(--posX);
      top: var(--posY);
      transform: translate(-50%,-50%);
      width: var(--maxW);
      color: var(--fg);
      text-align: var(--align);
      pointer-events: none; /* OBS에서 클릭 안 막기 */
    }
    #box{
      display:inline-block;
      background: var(--bg);
      padding: var(--pad);
      border-radius: var(--radius);
      filter: drop-shadow(var(--shadow));
      pointer-events: auto; /* HUD 켰을 때만 클릭 */
    }
    .hud-off #box{ pointer-events:none; } /* ✅ 방송용(hud=0)일 때 클릭 완전 통과 */

    .ja{ font-size: var(--jaSize); font-weight: 700; line-height: 1.25; }
    .ko{
      font-size: var(--koSize);
      font-weight: 700;
      line-height: 1.25;
      margin-top: var(--lineGap);
      color: var(--koColor);
      text-shadow: 0 2px 12px rgba(0,0,0,0.55);
    }

    /* ---------- HUD ---------- */
    #hud{
      margin-top: 10px;
      font-size: 13px;
      opacity: 0.85;
      user-select: none;
    }
    .hud-off #hud{ display:none; }

    #hudTop, #hudBottom{
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    #hud button, #hud input, #hud audio{
      pointer-events: auto;
      font-size: 13px;
    }
    #hud button{
      border: 0;
      border-radius: 10px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.95);
      cursor:pointer;
    }
    #hud button:hover{ background: rgba(255,255,255,0.18); }
    #hud .pill{
      background: rgba(255,255,255,0.10);
      padding: 6px 10px;
      border-radius: 10px;
    }
    #audio{
      width: min(720px, 86vw);
    }
  </style>
</head>
<body>

  <!-- Title fixed at TOP -->
  <div id="titleWrap">
    <div id="title"></div>
  </div>

  <!-- Subtitles + HUD -->
  <div id="wrap">
    <div id="box">
      <div id="ja" class="ja"></div>
      <div id="ko" class="ko" style="display:none;"></div>

      <div id="hud">
        <div id="hudTop">
          <button id="btnPrev">Prev</button>
          <button id="btnPlay">Play</button>
          <button id="btnNext">Next</button>

          <span class="pill">Track: <span id="trackLabel">-</span></span>
          <span class="pill">Offset: <span id="offsetLabel">0.0</span>s</span>

          <button id="btnOffM">-0.5s</button>
          <button id="btnOffP">+0.5s</button>
        </div>

        <div id="hudBottom">
          <audio id="audio" controls preload="auto" crossorigin="anonymous"></audio>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  const setId = params.get("set") || "default";
  const lang = (params.get("lang") || "both").toLowerCase(); // both|ja|ko
  const hud = params.get("hud"); // 0 => hide
  const cacheBust = params.get("cb") || "";

  // ✅ 기본 랜덤 재생
  const shuffleOn = (params.get("shuffle") ?? "1") !== "0";

  // ✅ 자막 hold gap: 기본 더 길게
  const HOLD_GAP = (() => {
    const v = Number(params.get("holdGap"));
    return Number.isFinite(v) ? v : 2.2; // default 2.2s (방송 안정)
  })();

  // ✅ autoplay 안정화 재시도 (HUD 없어도 시작되게)
  const AUTOPLAY_RETRY_SEC = (() => {
    const v = Number(params.get("autoRetry"));
    return Number.isFinite(v) ? v : 8.0; // default 8s
  })();

  const titleOn = (params.get("title") ?? "1") !== "0";
  if (!titleOn) document.body.classList.add("title-off");
  if (hud === "0") document.body.classList.add("hud-off");

  function num(v, d){ const n = Number(v); return Number.isFinite(n) ? n : d; }

  const cssVars = {
    "--posX": params.get("x") ? params.get("x") + "%" : null,
    "--posY": params.get("y") ? params.get("y") + "%" : null,
    "--jaSize": params.get("jaSize") ? params.get("jaSize") + "px" : null,
    "--koSize": params.get("koSize") ? params.get("koSize") + "px" : null,
    "--align": params.get("align") || null,
    "--maxW": params.get("maxW") ? params.get("maxW") + "vw" : null,

    "--titleSize": params.get("titleSize") ? params.get("titleSize") + "px" : null,
    "--titleGap": params.get("titleGap") ? params.get("titleGap") + "px" : null,
    "--titleOpacity": params.get("titleOpacity") ? params.get("titleOpacity") : null,
    "--titleTop": params.get("titleTop") ? params.get("titleTop") + "em" : null,

    "--koColor": params.get("koColor") ? params.get("koColor") : null,
  };
  for (const [k,v] of Object.entries(cssVars)) if (v) document.documentElement.style.setProperty(k, v);

  const titleEl = $("title");
  const jaEl = $("ja");
  const koEl = $("ko");
  const audio = $("audio");

  const btnPrev = $("btnPrev");
  const btnPlay = $("btnPlay");
  const btnNext = $("btnNext");
  const btnOffM = $("btnOffM");
  const btnOffP = $("btnOffP");
  const trackLabel = $("trackLabel");
  const offsetLabel = $("offsetLabel");

  const lsKey = `pt_offset_${setId}`;
  let offsetSec = num(localStorage.getItem(lsKey), 0.0);
  function setOffset(v){
    offsetSec = Math.round(v * 10) / 10;
    localStorage.setItem(lsKey, String(offsetSec));
    offsetLabel.textContent = offsetSec.toFixed(1);
  }
  setOffset(offsetSec);

  function withCB(url){
    const u = new URL(url, location.origin);
    u.searchParams.set("v", cacheBust || Date.now().toString());
    return u.toString();
  }

  async function fetchJSON(url){
    const res = await fetch(withCB(url), {cache:"no-store"});
    if (!res.ok) throw new Error(`fetch failed: ${res.status} ${url}`);
    return await res.json();
  }

  // ---------- cue extraction ----------
  function extractCues(obj){
  const cues = [];
  const seen = new Set();

  const norm = (s) => (s ?? "").toString().replace(/\r/g,"").trim();

  // "일본어\n한국어" 형태면 2줄로 분리
  function splitBilingual(text){
    text = norm(text);
    if (!text) return {ja:"", ko:""};
    const lines = text.split("\n").map(x=>x.trim()).filter(Boolean);
    return {
      ja: lines[0] || "",
      ko: lines[1] || ""
    };
  }

  // lines에서 (start,end)가 거의 같은 걸 찾아 KO 보강
  function koFromLinesByTime(lines, s, e){
    if (!Array.isArray(lines) || !lines.length) return "";
    const sf = Number(s), ef = Number(e);
    if (!Number.isFinite(sf) || !Number.isFinite(ef)) return "";
    // 약간의 오차 허용
    const EPS = 0.08;
    for (const ln of lines){
      if (!ln || typeof ln !== "object") continue;
      const ls = Number(ln.start), le = Number(ln.end);
      if (!Number.isFinite(ls) || !Number.isFinite(le)) continue;
      if (Math.abs(ls - sf) <= EPS && Math.abs(le - ef) <= EPS){
        return norm(ln.ko);
      }
    }
    return "";
  }

  function pushCue(s,e,ja,ko){
    s = Number(s); e = Number(e);
    if (!Number.isFinite(s) || !Number.isFinite(e) || e <= s) return;

    ja = norm(ja);
    ko = norm(ko);

    if (!ja) return;
    const key = `${s.toFixed(3)}|${e.toFixed(3)}|${ja}`;
    if (seen.has(key)) return;
    seen.add(key);

    cues.push({start:s, end:e, ja, ko});
  }

  const lines = (obj && Array.isArray(obj.lines)) ? obj.lines : null;

  // 1) cues 우선
  if (obj && typeof obj === "object" && Array.isArray(obj.cues) && obj.cues.length){
    for (const c of obj.cues){
      if (!c || typeof c !== "object") continue;

      // ✅ 케이스 A: ko가 있으면 그대로
      let ja = norm(c.ja);
      let ko = norm(c.ko);

      // ✅ 케이스 B: ko가 없으면 text에서 "JA\nKO" 파싱
      if (!ko){
        const bi = splitBilingual(c.text);
        if (!ja) ja = norm(bi.ja) || norm(c.text); // text가 한 줄이면 그걸 ja로
        ko = norm(bi.ko);
      }

      // ✅ 케이스 C: 여전히 ko가 없으면 lines에서 시간 매칭으로 보강
      if (!ko){
        ko = koFromLinesByTime(lines, c.start, c.end);
      }

      // ja가 비어있으면 text를 ja로 사용(원래대로 복구)
      if (!ja) ja = norm(c.text);

      pushCue(c.start, c.end, ja, ko);
    }
    cues.sort((a,b)=>a.start-b.start);
    return cues;
  }

  // 2) fallback: lines
  if (lines && lines.length){
    for (const ln of lines){
      if (!ln || typeof ln !== "object") continue;
      const ja = norm(ln.ja ?? ln.text);
      const ko = norm(ln.ko);
      pushCue(ln.start, ln.end, ja, ko);
    }
    cues.sort((a,b)=>a.start-b.start);
    return cues;
  }

  return cues;
}


  // ---------- cue pick ----------
  let lastCueIdx = 0;
  function cueAt(cues, t){
    if (!cues || cues.length === 0) return null;

    for (let i = lastCueIdx; i < cues.length; i++){
      const c = cues[i];
      if (t < c.start) break;
      if (t >= c.start && t < (c.end + HOLD_GAP)){
        lastCueIdx = i;
        return c;
      }
    }
    for (let i = Math.min(lastCueIdx, cues.length - 1); i >= 0; i--){
      const c = cues[i];
      if (t >= c.start && t < (c.end + HOLD_GAP)){
        lastCueIdx = i;
        return c;
      }
    }
    return null;
  }

  function clearSubtitle(){
    if (jaEl.textContent !== "") jaEl.textContent = "";
    if (koEl.textContent !== "") koEl.textContent = "";
    koEl.style.display = "none";
  }

  const base = `${location.origin}/set/${encodeURIComponent(setId)}/`;
  const playlistUrl = base + "playlist.json";

  let playlist = null;
  let idx = 0;
  let cues = [];
  let currentTrack = null;

  function updateTrackLabel(){
    if (!currentTrack){ trackLabel.textContent = "-"; return; }
    trackLabel.textContent = `${currentTrack.id}${currentTrack.title ? " · " + currentTrack.title : ""}`;
  }

  function setHeaderTitle(text){
    const t = (text ?? "").toString().trim();
    titleEl.textContent = t;
    if (t) document.title = `PT Player — ${t}`;
  }

  function shuffleArray(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function reshufflePlaylist(){
    if (!playlist || !Array.isArray(playlist.tracks)) return;
    if (shuffleOn){
      playlist.tracks = shuffleArray(playlist.tracks.slice());
    }
  }

  async function loadTrack(i){
    if (!playlist) return;
    idx = Math.max(0, Math.min(i, playlist.tracks.length-1));
    currentTrack = playlist.tracks[idx];
    updateTrackLabel();

    if (!currentTrack.audio_url) throw new Error("missing audio_url");
    audio.src = currentTrack.audio_url;

    if (!currentTrack.track_url) throw new Error("missing track_url");
    const trackJson = await fetchJSON(base + currentTrack.track_url);

    const t = (currentTrack && currentTrack.title) ? currentTrack.title : (trackJson && trackJson.title) ? trackJson.title : "";
    if (titleOn) setHeaderTitle(t);

    cues = extractCues(trackJson);
    lastCueIdx = 0;
    clearSubtitle();
  }

  function render(){
    if (!cues || cues.length === 0){
      clearSubtitle();
      return;
    }

    const t = audio.currentTime + offsetSec;
    const c = cueAt(cues, t);

    if (!c){
      clearSubtitle();
      return;
    }

    if (jaEl.textContent !== c.ja) jaEl.textContent = c.ja;

    const hasKo = !!(c.ko && c.ko.trim());
    if ((lang === "both" || lang === "ko") && hasKo){
      if (koEl.textContent !== c.ko) koEl.textContent = c.ko;
      koEl.style.display = "";
    } else {
      koEl.textContent = "";
      koEl.style.display = "none";
    }
  }

  // ---------- controls ----------
  btnPlay.addEventListener("click", async () => {
    if (!playlist) return;
    if (audio.paused) await audio.play();
    else audio.pause();
  });
  audio.addEventListener("play", ()=> btnPlay.textContent = "Pause");
  audio.addEventListener("pause", ()=> btnPlay.textContent = "Play");

  btnPrev.addEventListener("click", async () => {
    await loadTrack(idx - 1);
    await audio.play();
  });
  btnNext.addEventListener("click", async () => {
    await loadTrack(idx + 1);
    await audio.play();
  });

  btnOffM.addEventListener("click", ()=> setOffset(offsetSec - 0.5));
  btnOffP.addEventListener("click", ()=> setOffset(offsetSec + 0.5));

  window.addEventListener("keydown", (e)=>{
    if (e.key === "ArrowLeft") btnPrev.click();
    if (e.key === "ArrowRight") btnNext.click();
    if (e.key === "ArrowDown") setOffset(offsetSec - 0.5);
    if (e.key === "ArrowUp") setOffset(offsetSec + 0.5);
    if (e.key === " "){ e.preventDefault(); btnPlay.click(); }
  });

  audio.addEventListener("timeupdate", render);
  audio.addEventListener("seeked", render);

  audio.addEventListener("ended", async () => {
    if (!playlist) return;

    if (idx < playlist.tracks.length - 1){
      await loadTrack(idx + 1);
      await audio.play();
      return;
    }

    // 마지막 트랙 끝: 무한 루프
    reshufflePlaylist();
    await loadTrack(0);
    await audio.play();
  });

  // ---------- boot ----------
  (async () => {
    playlist = await fetchJSON(playlistUrl);

    if (!playlist || !Array.isArray(playlist.tracks) || playlist.tracks.length === 0){
      throw new Error("playlist.json invalid or empty");
    }

    reshufflePlaylist();

    const startI = num(params.get("i"), 1);
    await loadTrack(startI - 1);

    // autoplay=1이면 바로 시도 + 재시도
    if (params.get("autoplay") === "1"){
      try { await audio.play(); } catch (e) {}
    }

    updateTrackLabel();
    offsetLabel.textContent = offsetSec.toFixed(1);
  })().catch(err => {
    jaEl.textContent = "PLAYER ERROR";
    koEl.style.display = "";
    koEl.textContent = String(err?.message || err);
    console.error(err);
  });

})();
</script>
</body>
</html>
